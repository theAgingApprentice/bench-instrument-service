services:
  bench-instrument-service:
    build: .
    image: bench-instrument-service:latest
    container_name: bench-instrument-service
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"       # Direct access during development; close in production
    networks:
      - mitchellnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  mitchellnet:
    external: true
