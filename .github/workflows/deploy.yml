name: Deploy BIS

on:
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run the test suite (no real instruments required)
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # 2. Build the Docker image and push to GHCR
  #    docker-compose.yml pulls ghcr.io/theagingapprentice/bench-instrument-service:latest
  #    so this job must succeed before the deploy job pulls on the server.
  # ---------------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/theagingapprentice/bench-instrument-service:latest

  # ---------------------------------------------------------------------------
  # 3. SSH to the production server, pull the new image, and restart the service
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /home/andrew/services/bench-instrument-service
            git pull origin main
            docker compose pull
            docker compose up -d --no-deps bench-instrument-service
            sleep 5
            curl -f http://localhost:8000/health || exit 1
