name: Deploy BIS to Production

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install dependencies
        run: |
          python3 -m venv /home/andrew/bis-venv
          /home/andrew/bis-venv/bin/pip install -r requirements-dev.txt --quiet

      - name: Run tests
        run: |
          /home/andrew/bis-venv/bin/pytest tests/ -v

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: self-hosted
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set variables
        run: |
          echo "SERVICE_ROOT=/home/andrew/services/bench-instrument-service" >> $GITHUB_ENV

      - name: Ensure service directory exists
        run: |
          mkdir -p /home/andrew/services/bench-instrument-service

      - name: Deploy code to service directory
        run: |
          set -euo pipefail
          echo "=== Syncing code to $SERVICE_ROOT ==="
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            ./ "$SERVICE_ROOT"/
          echo "Code sync completed"

      - name: Build and restart container
        run: |
          set -euo pipefail
          cd "$SERVICE_ROOT"
          echo "=== Building BIS image ==="
          docker compose build bench-instrument-service
          echo "=== Restarting BIS container ==="
          docker compose up -d --no-deps bench-instrument-service
          echo "Container restarted"

      - name: Verify deployment
        run: |
          set -euo pipefail
          echo "Waiting for container to be ready..."
          sleep 5
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8001/health)
          echo "Health check status: $status"
          if [ "$status" != "200" ]; then
            echo "ERROR: Health check failed with status $status"
            docker compose -f /home/andrew/services/bench-instrument-service/docker-compose.yml logs bench-instrument-service
            exit 1
          fi
          echo "✅ BIS deployment verified successfully"

      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 BIS Deployment Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Commit: $GITHUB_SHA"
          echo "Deployed by: ${{ github.actor }}"
          echo "URL: https://mitchellnet.local/api/bench/"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
